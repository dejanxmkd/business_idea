<!doctype html><html lang="mk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#FAF8F3"><title>Admin Login · ToySharing</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#FAF8F3;color:#273D2D;font:600 15px/1.6 'Nunito',sans-serif;display:flex;align-items:center;justify-content:center;padding:25px}main{width:min(100%,450px)}.brand{text-align:center;margin-bottom:30px}.brand img{max-width:180px;max-height:85px;object-fit:contain}.card{background:white;border:1px solid #e5e9e0;border-radius:24px;padding:38px;box-shadow:0 16px 45px #273d2d0a}h1{margin:0 0 8px;font-size:30px;line-height:1.2;font-weight:900}p{margin:0 0 25px;color:#738174}label{display:block;font-size:13px;font-weight:900;margin:17px 0 7px}input{width:100%;min-height:49px;border:1px solid #dbe2d9;border-radius:11px;padding:10px 14px;font:inherit;background:#fff;color:#273D2D}input:focus{outline:2px solid #64866B;outline-offset:1px}button{background:#E86B5B;color:white;border:none;border-radius:11px;width:100%;padding:14px;margin-top:25px;font:900 15px 'Nunito',sans-serif;cursor:pointer}button:hover{background:#D85D4F}.hint{margin-top:19px;padding:13px;background:#edf3e8;border-radius:10px;font-size:12px;color:#536e57}.error{color:#c94747;font-size:13px;min-height:20px;margin-top:12px}.back{display:block;text-align:center;color:#64866B;font-weight:900;margin-top:23px;text-decoration:none}@media(max-width:500px){.card{padding:28px}}</style></head><body><main><div class="brand"><a href="./landing.html"><img src="./assets/ToySharing%20House%20of%20Play.png" alt="ToySharing"></a></div><div class="card"><h1>Admin Login</h1><p>Најави се за да го отвориш ToySharing dashboard-от.</p><form id="login"><label for="email">Корисничко име</label><input id="email" name="email" type="text" autocomplete="username" required placeholder="Корисничко име"><label for="password">Лозинка</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Лозинка"><button type="submit">Влези во Dashboard →</button><div class="error" id="error" role="alert" aria-live="polite"></div></form><div class="hint">Ова е демо најава, не вистинска заштита на податоците.</div></div><a class="back" href="./landing.html">← Назад на веб-сајтот</a></main><script>document.getElementById("login").addEventListener("submit",function(e){e.preventDefault();const email=document.getElementById("email").value.trim().toLowerCase(),pass=document.getElementById("password").value;if(email==="dejanxmkd"&&pass==="861982f2"){sessionStorage.setItem("toysharing_demo_admin","1");location.href="./index.html"}else document.getElementById("error").textContent="Погрешен email или лозинка."});if(sessionStorage.getItem("toysharing_demo_admin")==="1")location.replace("./index.html");</script></body></html>
